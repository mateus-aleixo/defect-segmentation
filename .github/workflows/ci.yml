name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts

      - name: Test (synthetic fixtures — no dataset, no weights, no network)
        run: pytest

  image:
    name: serving image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Lambda adapter only runs on Lambda, and anonymous pulls of it from ECR Public
      # fail on shared runners. CI builds against an empty stand-in; deploy.yml builds
      # the real one.
      - name: Stand-in for the Lambda adapter
        run: |
          mkdir -p /tmp/adapter && touch /tmp/adapter/lambda-adapter
          printf 'FROM scratch\nCOPY lambda-adapter /lambda-adapter\n' | docker build -t lambda-adapter:ci -f - /tmp/adapter

      - name: Build
        run: docker build --build-arg LAMBDA_ADAPTER_IMAGE=lambda-adapter:ci -t conformal-seg:ci .

      # The serving image installs the package with --no-deps on top of a pinned,
      # torch-free requirements set. That is easy to break by editing pyproject,
      # and the breakage is invisible until someone looks at a 2 GB image. Assert it.
      - name: Assert the image is torch-free
        run: |
          if docker run --rm conformal-seg:ci python -c "import torch" 2>/dev/null; then
            echo "::error::torch reached the serving image" && exit 1
          fi
          echo "confirmed: no torch in the serving image"
          docker image inspect conformal-seg:ci --format 'image size: {{.Size}} bytes'

      - name: Smoke test the API
        run: |
          docker run -d --name api -p 8000:8000 conformal-seg:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          # No registry is committed, so /models must answer 503 rather than crash.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/models)" = "503"
          docker rm -f api
