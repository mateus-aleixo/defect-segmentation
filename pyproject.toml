[project]
name = "conformal-seg"
version = "0.1.0"
description = "Industrial defect segmentation with conformal risk control: predicted masks provably miss at most alpha of true defect pixels."
authors = [{ name = "Mateus Filipe Aleixo", email = "mateusfilipealeixo@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
# onnxscript: torch >= 2.9 exports through the dynamo path, which requires it
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnxruntime>=1.18",
    "mangum>=0.17",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.urls]
Repository = "https://github.com/mateus-aleixo/defect-segmentation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformal_seg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Same rule set as turbofan-rul and maintenance-qa-agent.
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI declares dependencies as argument defaults. Calling File()/Query()
# in the signature is the framework's required idiom, not a mutable-default bug.
"src/conformal_seg/serve/app.py" = ["B008"]
